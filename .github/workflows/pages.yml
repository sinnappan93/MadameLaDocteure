# Publie l'application web sur GitHub Pages à chaque envoi sur main,
# seulement si les tests (unitaires et de bout en bout) passent.
name: Site web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests et vérification des types
        run: |
          npm run typecheck
          npm test

      - name: Construire l'application web
        run: npm run build

      - name: Tests de bout en bout (navigateur, réseau simulé)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
